name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: docker
    container:
      image: docker.io/library/alpine:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        shell: sh
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            aarch64) GOARCH=arm64 ;;
            x86_64)  GOARCH=amd64 ;;
            *)       echo "unsupported arch: $ARCH"; exit 1 ;;
          esac
          wget -q "https://go.dev/dl/go1.26.5.linux-${GOARCH}.tar.gz" -O /tmp/go.tar.gz
          tar xzf /tmp/go.tar.gz -C /usr/local
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Build binaries
        shell: sh
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o "dist/piensa-linux-amd64"    ./cmd/piensa/
          GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=${VERSION}" -o "dist/piensa-linux-arm64"    ./cmd/piensa/
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o "dist/piensa-darwin-amd64"  ./cmd/piensa/
          GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.version=${VERSION}" -o "dist/piensa-darwin-arm64"  ./cmd/piensa/

          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o "dist/terraform-provider-piensa-linux-amd64" ./cmd/terraform-provider-piensa/
          GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=${VERSION}" -o "dist/terraform-provider-piensa-linux-arm64" ./cmd/terraform-provider-piensa/

          cd dist
          for f in *; do
            case "$f" in
              *.sha256) ;;
              *) sha256sum "$f" > "$f.sha256" ;;
            esac
          done

      - name: Create release
        uses: gitea/release-action@v1
        with:
          files: dist/*
          api_key: ${{ secrets.GITHUB_TOKEN }}
