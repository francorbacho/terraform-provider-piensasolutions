name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        shell: sh
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            aarch64) GOARCH=arm64 ;;
            x86_64)  GOARCH=amd64 ;;
            *)       echo "unsupported arch: $ARCH"; exit 1 ;;
          esac
          wget -q "https://go.dev/dl/go1.26.5.linux-${GOARCH}.tar.gz" -O /tmp/go.tar.gz
          tar xzf /tmp/go.tar.gz -C /usr/local
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Build binaries
        shell: sh
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o "dist/piensa-linux-amd64"    ./cmd/piensa/
          GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=${VERSION}" -o "dist/piensa-linux-arm64"    ./cmd/piensa/

          # Build provider binaries and package into Forgejo-compatible tar.gz
          for GOOS in linux; do
            for GOARCH in amd64 arm64; do
              GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "-X main.version=${VERSION}" -o "/tmp/terraform-provider-piensasolutions_v${VERSION}_${GOOS}_${GOARCH}" ./cmd/terraform-provider-piensasolutions/
              tar czf "dist/terraform-provider-piensasolutions_${VERSION}_${GOOS}_${GOARCH}.tar.gz" -C /tmp "terraform-provider-piensasolutions_v${VERSION}_${GOOS}_${GOARCH}"
            done
          done

          cd dist
          for f in *; do
            case "$f" in
              *.sha256) ;;
              *) sha256sum "$f" > "$f.sha256" ;;
            esac
          done

      - name: Create release
        shell: sh
        run: |
          TAG="${GITHUB_REF_NAME}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          # Create the release
          curl -s -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(cat <<EOF
          {
            "tag_name": "${TAG}",
            "name": "${TAG}",
            "body": "Release ${TAG}"
          }
          EOF
          )" \
            "${API}/releases" > /tmp/release.json

          RELEASE_ID=$(python3 -c "import json,sys; print(json.load(sys.stdin)['id'])" < /tmp/release.json)

          # Upload each asset
          for f in dist/*; do
            echo "Uploading ${f}..."
            curl -s -X POST \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -F "attachment=@${f}" \
              "${API}/releases/${RELEASE_ID}/assets?name=$(basename "${f}")" > /dev/null
          done
