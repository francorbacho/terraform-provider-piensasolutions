name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Build binaries
        shell: sh
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          # CLI binaries (fully static; run on both glibc and musl hosts)
          for GOOS in linux darwin; do
            for GOARCH in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
                -ldflags "-X main.version=${VERSION}" \
                -o "dist/piensa-${GOOS}-${GOARCH}" ./cmd/piensa/
            done
          done

          # Provider packages in registry format (zip + SHA256SUMS).
          # The zip contents and naming must match what the OpenTofu /
          # Terraform registries consume: terraform-provider-<name>_<ver>_<os>_<arch>.zip
          DIST="$(pwd)/dist"
          for GOOS in linux darwin; do
            for GOARCH in amd64 arm64; do
              STAGE=$(mktemp -d)
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
                -ldflags "-X main.version=${VERSION}" \
                -o "$STAGE/terraform-provider-piensasolutions" ./cmd/terraform-provider-piensasolutions/
              (cd "$STAGE" && zip -q "$DIST/terraform-provider-piensasolutions_${VERSION}_${GOOS}_${GOARCH}.zip" terraform-provider-piensasolutions)
              rm -rf "$STAGE"
            done
          done
          (cd dist && sha256sum terraform-provider-piensasolutions_${VERSION}_*.zip > terraform-provider-piensasolutions_${VERSION}_SHA256SUMS)

          # Arch Linux packages (.pkg.tar.zst) from the CLI binaries
          if command -v zstd >/dev/null 2>&1; then
            arch_pkg() {
              local arch=$1 binary=$2
              local pkg="piensa-${VERSION}-1-${arch}"
              local dir=$(mktemp -d)
              mkdir -p "$dir/usr/bin"
              cp "dist/${binary}" "$dir/usr/bin/piensa"
              SIZE=$(wc -c < "dist/${binary}")
              {
                echo "pkgname = piensa"
                echo "pkgver = ${VERSION}-1"
                echo "pkgdesc = PiensaSolutions VPS manager CLI"
                echo "url = https://github.com/francorbacho/terraform-provider-piensasolutions"
                echo "builddate = $(date +%s)"
                echo "packager = CI Runner"
                echo "size = ${SIZE}"
                echo "arch = ${arch}"
                echo "license = MIT"
              } > "$dir/.PKGINFO"
              tar -cf - -C "$dir" usr .PKGINFO | zstd -o "dist/${pkg}.pkg.tar.zst"
              rm -rf "$dir"
            }
            arch_pkg x86_64 piensa-linux-amd64
            arch_pkg aarch64 piensa-linux-arm64
          else
            echo "zstd not found - skipping Arch Linux packages"
          fi

          # Checksums for the CLI binaries
          cd dist
          for f in piensa-*; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: sh
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}"