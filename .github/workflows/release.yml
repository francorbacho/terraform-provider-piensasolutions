name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Import GPG key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Build and package provider
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PROVIDER_NAME="piensasolutions"
          mkdir -p dist

          # Build CLI binaries
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o "dist/piensa-linux-amd64"    ./cmd/piensa/
          GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=${VERSION}" -o "dist/piensa-linux-arm64"    ./cmd/piensa/
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o "dist/piensa-darwin-amd64"  ./cmd/piensa/
          GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.version=${VERSION}" -o "dist/piensa-darwin-arm64"  ./cmd/piensa/

          # Build and package provider for each platform
          for os in linux darwin; do
            for arch in amd64 arm64; do
              binary="terraform-provider-${PROVIDER_NAME}_v${VERSION}"
              if [ "$os" = "windows" ]; then binary="${binary}.exe"; fi
              zipfile="terraform-provider-${PROVIDER_NAME}_${VERSION}_${os}_${arch}.zip"

              GOOS=$os GOARCH=$arch go build -ldflags "-X main.version=${VERSION}" -o "dist/${binary}" ./cmd/terraform-provider-piensa/
              cd dist
              zip "$zipfile" "$binary"
              rm "$binary"
              cd ..
            done
          done

          # Add Windows builds
          for arch in amd64 arm64; do
            binary="terraform-provider-${PROVIDER_NAME}_v${VERSION}.exe"
            zipfile="terraform-provider-${PROVIDER_NAME}_${VERSION}_windows_${arch}.zip"

            GOOS=windows GOARCH=$arch go build -ldflags "-X main.version=${VERSION}" -o "dist/${binary}" ./cmd/terraform-provider-piensa/
            cd dist
            zip "$zipfile" "$binary"
            rm "$binary"
            cd ..
          done

          # Write registry manifest
          cat > "dist/terraform-provider-${PROVIDER_NAME}_${VERSION}_manifest.json" <<EOF
      {
        "version": 1,
        "metadata": {
          "protocol_versions": ["5.0"]
        }
      }
      EOF

          # Generate checksums
          cd dist
          sha256sum *.zip *.json > "terraform-provider-${PROVIDER_NAME}_${VERSION}_SHA256SUMS"

          # Sign checksums with GPG
          gpg --detach-sign --armor \
            "terraform-provider-${PROVIDER_NAME}_${VERSION}_SHA256SUMS"

          # Also sign CLI binaries
          for f in piensa-*; do
            case "$f" in
              *.sha256) ;;
              *) sha256sum "$f" > "$f.sha256" ;;
            esac
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
